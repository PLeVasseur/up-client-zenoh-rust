[package]
description = "Zenoh Rust Transport library implementation of the Eclipse uProtocol"
edition = "2021"
include = ["/src/*", "/examples/*", "/Cargo.toml", "/README.md", "/config/*"]
keywords = ["uProtocol", "SDK", "communication", "Zenoh"]
license = "Apache-2.0"
name = "up-transport-zenoh"
readme = "README.md"
repository = "https://github.com/eclipse-uprotocol/up-transport-zenoh-rust"
rust-version = "1.88"
version = "0.10.0"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
borrow_as_ptr = "deny"
ptr_as_ptr = "deny"
as_ptr_cast_mut = "deny"
as_pointer_underscore = "deny"
not_unsafe_ptr_arg_deref = "deny"
transmute_ptr_to_ptr = "deny"
transmute_ptr_to_ref = "deny"
#cargo = "deny"
#restriction = "deny"
#nursery = "deny"

[features]
default = []
zero-copy = ["zenoh/shared-memory", "zenoh/unstable"]

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1"
bytes = "1.10.1"
tokio = { version = "1.45.1", default-features = false }
tracing = "0.1.40"
up-rust = { git = "https://github.com/PLeVasseur/up-rust.git", rev = "6db506f0deff5de4f1093d1378d7dd40d3bb9f5d", default-features = false }
# [impl->dsn~up-transport-zenoh-protocol-version~1]
zenoh = { version = "1.9.0" }

[dev-dependencies]
chrono = "0.4.44"
clap = { version = "4.5.51", features = ["derive"] }
serde_json = "1.0.145"
protobuf = { version = "3.7.2", features = ["with-bytes"] }
serial_test = { version = "3.4.0" }
test-case = { version = "3.3" }
tokio = { version = "1.45.1", default-features = false, features = ["rt-multi-thread", "signal"] }
tracing-subscriber = "0.3.23"
up-rust = { git = "https://github.com/PLeVasseur/up-rust.git", rev = "6db506f0deff5de4f1093d1378d7dd40d3bb9f5d", features = ["protobuf-wire", "test-util"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }
unsafe_op_in_unsafe_fn = "deny"
missing_unsafe_on_extern = "deny"
unsafe_attr_outside_unsafe = "deny"
unused_unsafe = "deny"
deprecated_safe_2024 = "deny"
ffi_unwind_calls = "deny"
static_mut_refs = "deny"
clashing_extern_declarations = "deny"
