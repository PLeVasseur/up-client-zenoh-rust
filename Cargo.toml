[package]
description = "Zenoh Rust Transport library implementation of the Eclipse uProtocol"
edition = "2021"
include = [
    "/benches/*",
    "/src/*",
    "/scripts/*",
    "/examples/*",
    "/Cargo.toml",
    "/README.md",
]
keywords = ["uProtocol", "SDK", "communication", "Zenoh"]
license = "Apache-2.0"
name = "up-transport-zenoh"
readme = "README.md"
repository = "https://github.com/eclipse-uprotocol/up-transport-zenoh-rust"
rust-version = "1.88"
version = "0.1.0"

[lints.clippy]
all = "deny"
pedantic = "deny"
#cargo = "deny"
#restriction = "deny"
#nursery = "deny"

[features]
default = []
benchmark-owned = ["up-rust/owned-frame-transport"]
payload-contract-benchmarks = ["up-rust/payload-contract-fixtures"]
payload-contract-large-benchmarks = [
    "payload-contract-benchmarks",
    "up-rust/payload-contract-large-fixtures",
]
perf-diagnostics = [
    "benchmark-owned",
    "payload-contract-large-benchmarks",
    "up-rust/perf-diagnostics",
    "zero-copy",
]
zero-copy = ["zenoh/shared-memory", "zenoh/unstable"]

[[bench]]
name = "transport_criterion"
harness = false
required-features = ["zero-copy", "benchmark-owned", "payload-contract-benchmarks"]

[dependencies]
anyhow = "1.0.75"
async-trait = "0.1"
bitmask-enum = "2.2.4"
bytes = "1"
chrono = "0.4.31"
crossbeam-channel = "0.5.12"
prost = "0.12"
prost-types = "0.12"
protobuf = { version = "3.3" }
rand = "0.8.5"
tokio = { version = "1.45.1", default-features = false }
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
up-rust = { git = "ssh://git@github.com/PLeVasseur/up-rust.git", rev = "c4ba2590bc1ff85850f7715397bd020c18e26430", default-features = false, features = ["communication", "owned-frame-transport", "protobuf-wire", "selected-wire-user-api", "transport-implementer-api", "wire-implementer-api", "zero-copy-uninit"] }
zenoh = { version = "1.9.0", features = ["internal", "unstable"] }

[dev-dependencies]
criterion = { version = "0.5.1", features = ["csv_output"] }
serde_json = "1.0.145"
serial_test = "3.2"
test-case = { version = "3.3" }
up-wire-xcdrv2 = { git = "ssh://git@github.com/PLeVasseur/up-wire-xcdrv2-rust.git", rev = "50cc397ff9a0f2cc66a8ce9a3862fe54b476e615" }

[[test]]
name = "zero_copy_transport"
required-features = ["zero-copy"]

[[test]]
name = "zenoh_owned_wire"
required-features = ["benchmark-owned"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[package.metadata.docs.rs]
all-features = true
